name: CI Pipeline API Testing
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

steps:
   -name: Checkout del codigo
    users:actions/checkout@v4

-name: Configurar Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

-name: Levantar entorno con Docker Compose
    run: docker-compose up -d--build     

-namee: Ejecutar pruebas con Pytest
  run:dockercompose exec -Tapi pytest -v     
